<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dance Academy Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6c0df2",
                        "background-light": "#f7f5f8",
                        "background-dark": "#171022",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for better aesthetic in dark mode */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #171022; 
        }
        ::-webkit-scrollbar-thumb {
            background: #333; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen flex flex-col overflow-hidden">
<div class="flex flex-1 h-screen w-full flex-row">
<!-- Left Pane: Visuals / Mood Setter -->
<div class="hidden lg:flex w-1/2 relative flex-col justify-end p-12 overflow-hidden bg-black/90">
<!-- Background Image -->
<div class="absolute inset-0 bg-center bg-no-repeat bg-cover opacity-60 mix-blend-luminosity hover:mix-blend-normal hover:scale-105 transition-all duration-1000 ease-out" data-alt="Black and white artistic photo of a contemporary dancer in motion" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBOLndS7MoAVZ3D9aZ12pzWpproUxTxeH7_XG5AxvTrCUyWIGBGpcWh4EIp3q_MSXyTFft_zmiOJQ84XHAshhj-H0r-9t9InycDG6wHPaJpX4br3cxYswYGj9FGppI5lzI30gIkb6iKsnV7_pmR6zx35OWVoKAI6ns2OLzoVivM-FfiXmDmEsowCW7mNXySpsII8q53OmOzWFW8fiJoNkoMfmQdQMWUR8mJvkDodpyE8GoAM9Ersq1NAYCA56uoD6Aa71GOJkMhC6k");'>
</div>
<!-- Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-background-dark via-background-dark/40 to-transparent"></div>
<!-- Content -->
<div class="relative z-10 max-w-lg">
<span class="inline-block px-3 py-1 mb-6 rounded-full border border-slate-500/50 bg-slate-900/30 backdrop-blur-sm text-xs font-semibold tracking-wider text-slate-300 uppercase">
                    Daily Inspiration
                </span>
<h1 class="text-white tracking-tight text-5xl font-bold leading-[1.1] mb-6 drop-shadow-lg">
                    "Movement is the language of the soul."
                </h1>
<p class="text-slate-300 text-lg font-light flex items-center gap-2">
<span class="w-8 h-[1px] bg-primary"></span>
                    Dance Academy Encyclopedia
                </p>
</div>
</div>
<!-- Right Pane: Functional Zone / Form -->
<div class="w-full lg:w-1/2 flex flex-col justify-center items-center bg-background-light dark:bg-background-dark px-6 py-12 relative overflow-y-auto">
<!-- Mobile Header Background (Only visible on small screens) -->
<div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-transparent via-primary to-transparent opacity-50 lg:hidden"></div>
<div class="w-full max-w-[420px] flex flex-col gap-8">
<!-- Brand Logo & Header -->
<div class="text-center space-y-2">
<div class="flex justify-center mb-6">
<div class="h-12 w-12 rounded-xl bg-gradient-to-br from-primary to-purple-900 flex items-center justify-center text-white shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-3xl">local_activity</span>
</div>
</div>
<h2 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Welcome Back</h2>
<p class="text-slate-500 dark:text-slate-400">Login to access your premium classes.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-white dark:bg-[#1f162e] border border-slate-200 dark:border-slate-700/50 rounded-lg text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="password">Password</label>
<a class="text-xs font-medium text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-white dark:bg-[#1f162e] border border-slate-200 dark:border-slate-700/50 rounded-lg text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Login Button -->
<button class="mt-2 w-full bg-primary hover:bg-primary/90 text-white font-semibold py-3.5 px-4 rounded-lg transition-all duration-200 shadow-lg shadow-primary/25 hover:shadow-primary/40 active:scale-[0.98]" type="button">
                        Log In
                    </button>
</form>
<!-- Divider -->
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
<span class="flex-shrink-0 mx-4 text-xs font-medium text-slate-400 uppercase tracking-widest">Or continue with</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
</div>
<!-- Social Login Buttons -->
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 px-4 py-3 bg-white dark:bg-[#1f162e] border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors group">
<!-- Google SVG -->
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-semibold text-slate-600 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-white">Google</span>
</button>
<button class="flex items-center justify-center gap-2 px-4 py-3 bg-white dark:bg-[#1f162e] border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors group">
<!-- Apple SVG -->
<svg class="w-5 h-5 dark:fill-white fill-black" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.1 2.69-1.01 4.15-.6 2.58.74 3.66 3.32 3.66 3.37-.03.04-3.2 1.34-3.1 5.31.06 2.66 2.62 3.86 2.62 3.86-.3.94-1.3 3.24-2.4 4.35l-.01-.12zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"></path>
</svg>
<span class="text-sm font-semibold text-slate-600 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-white">Apple</span>
</button>
</div>
<!-- Footer Sign Up -->
<div class="text-center mt-4">
<p class="text-sm text-slate-500 dark:text-slate-400">
                        New here? 
                        <a class="font-semibold text-primary hover:text-primary/80 transition-colors" href="#">Create an account</a>
</p>
</div>
</div>
<!-- Bottom Legal Links (Optional polish) -->
<div class="absolute bottom-6 w-full text-center hidden lg:block">
<div class="flex justify-center gap-6 text-xs text-slate-400/50">
<a class="hover:text-slate-400 transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-slate-400 transition-colors" href="#">Terms of Service</a>
</div>
</div>
</div>
</div>
</body></html>
